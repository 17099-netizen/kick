<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>System Status</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #1a1a1a; color: #eee; }
        .navbar { background: #333; padding: 10px; display: flex; gap: 15px; }
        .navbar a { color: #eee; text-decoration: none; padding: 8px 12px; border-radius: 4px; }
        .navbar a:hover { background: #555; }
        .container { max-width: 800px; margin: 20px auto; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .status-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #444; }
        .status-label { font-weight: bold; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; }
        .badge-success { background: #4CAF50; }
        .badge-error { background: #f44336; }
        .badge-warning { background: #ff9800; }
        .badge-info { background: #2196F3; }
        pre { background: #111; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { background: #4CAF50; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/dashboard">Dashboard</a>
        <a href="/test">Test</a>
        <a href="/status">Status</a>
        <a href="/logout" style="margin-left:auto;">Logout</a>
    </div>

    <div class="container">
        <h1>System Status</h1>
        <button onclick="refreshStatus()">🔄 Refresh</button>
        <div id="statusContent">
            <p>Loading...</p>
        </div>
    </div>

    <script>
        async function refreshStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            renderStatus(data);
        }

        function renderStatus(data) {
            const container = document.getElementById('statusContent');
            if (!data.ok) {
                container.innerHTML = `<p>Error: ${data.error}</p>`;
                return;
            }
            let html = `<div class="card"><h2>📊 Overview</h2>`;
            const items = [
                { label: 'Authenticated', value: data.authenticated, type: 'bool' },
                { label: 'Access Token Present', value: data.access_token_present, type: 'bool' },
                { label: 'Live Running', value: data.live_running, type: 'bool' },
                { label: 'Mistral Configured', value: data.mistral_configured, type: 'bool' },
                { label: 'TTS Configured', value: data.tts_configured, type: 'bool' },
                { label: 'GiveDonate Configured', value: data.givedonate_configured, type: 'bool' },
                { label: 'KICK Broadcaster ID', value: data.kick_broadcaster_user_id || 'N/A', type: 'text' },
                { label: 'Webhook URL', value: data.webhook_url || 'N/A', type: 'text' },
                { label: 'Chat Messages Seen', value: data.chat_seen_count, type: 'number' },
            ];
            items.forEach(item => {
                let valueDisplay;
                if (item.type === 'bool') {
                    const cls = item.value ? 'badge-success' : 'badge-error';
                    const text = item.value ? '✅ ON' : '❌ OFF';
                    valueDisplay = `<span class="badge ${cls}">${text}</span>`;
                } else {
                    valueDisplay = `<span>${item.value}</span>`;
                }
                html += `<div class="status-item"><span class="status-label">${item.label}</span><span class="status-value">${valueDisplay}</span></div>`;
            });
            html += `</div>`;

            if (data.webhook_subscription) {
                html += `<div class="card"><h2>📨 Webhook Subscription</h2>`;
                const sub = data.webhook_subscription;
                html += `<div class="status-item"><span>Status</span><span class="badge ${sub.ok ? 'badge-success' : 'badge-error'}">${sub.ok ? 'Active' : 'Inactive'}</span></div>`;
                html += `<div class="status-item"><span>Has Subscription</span><span class="badge ${sub.has_subscription ? 'badge-success' : 'badge-warning'}">${sub.has_subscription ? 'Yes' : 'No'}</span></div>`;
                if (sub.data) {
                    html += `<pre>${JSON.stringify(sub.data, null, 2)}</pre>`;
                }
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        refreshStatus();
    </script>
</body>
</html>
