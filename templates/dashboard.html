<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>AI Live Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #1a1a1a; color: #eee; }
        .navbar { background: #333; padding: 10px; display: flex; gap: 15px; }
        .navbar a { color: #eee; text-decoration: none; padding: 8px 12px; border-radius: 4px; }
        .navbar a:hover { background: #555; }
        .container { max-width: 800px; margin: 20px auto; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        input { width: 100%; padding: 8px; margin: 8px 0; border-radius: 4px; border: 1px solid #555; background: #333; color: #eee; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/dashboard">Dashboard</a>
        <a href="/test">Test</a>
        <a href="/status">Status</a>
        <a href="/logout" style="margin-left:auto;">Logout</a>
    </div>

    <div class="container">
        <h1>Dashboard</h1>

        <div class="card">
            <h2>Live Control</h2>
            <button id="startBtn">Start Live</button>
            <button id="stopBtn">Stop Live</button>
            <span id="liveStatus">Stopped</span>
        </div>

        <div class="card">
            <h2>AI Speak</h2>
            <input type="text" id="aiText" placeholder="พิมพ์ข้อความ...">
            <button id="speakBtn">Speak</button>
        </div>

        <div class="card">
            <h2>KICK Webhook</h2>
            <button id="subscribeBtn">Subscribe</button>
            <button id="subscriptionsBtn">View Subscriptions</button>
        </div>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', async () => {
            const res = await fetch('/api/start', { method: 'POST' });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        });
        document.getElementById('stopBtn').addEventListener('click', async () => {
            const res = await fetch('/api/stop', { method: 'POST' });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        });
        document.getElementById('speakBtn').addEventListener('click', async () => {
            const text = document.getElementById('aiText').value;
            if (!text) return;
            const res = await fetch('/api/ai/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        });
        document.getElementById('subscribeBtn').addEventListener('click', async () => {
            const res = await fetch('/api/kick/subscribe', { method: 'POST' });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        });
        document.getElementById('subscriptionsBtn').addEventListener('click', async () => {
            const res = await fetch('/api/kick/subscriptions');
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        });
    </script>
</body>
</html>
