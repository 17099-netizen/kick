<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI KICK Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #24412f,
                    #0b0f0c 55%
                );
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(20, 25, 22, .95);
            border: 1px solid #34463b;
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            box-shadow:
                0 25px 80px rgba(0,0,0,.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aeb8b1;
            line-height: 1.6;
        }

        .kick {
            color: #53ff9d;
        }

        .login {
            display: block;
            margin-top: 28px;
            padding: 16px;
            background: #53ff9d;
            color: #07100b;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #451b1b;
            color: #ffb1b1;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>
        AI <span class="kick">KICK</span> Live
    </h1>

    <p>
        ระบบควบคุม Live Stream
        และ AI แบบ Real-Time
    </p>

    <a
        class="login"
        href="/login"
    >
        เข้าสู่ระบบด้วย KICK
    </a>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

</div>

</body>
</html>
